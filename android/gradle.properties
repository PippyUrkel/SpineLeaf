org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Keep the Gradle daemon alive between builds
org.gradle.daemon=true

# Build independent modules in parallel
org.gradle.parallel=true

# Reuse task outputs between builds
org.gradle.caching=true

# Avoid configuring projects that aren't needed
org.gradle.configureondemand=true

# Android
android.useAndroidX=true

# Flutter template compatibility
android.newDsl=false
android.builtInKotlin=false