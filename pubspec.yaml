name: material_3_demo
description: A modern e-book reader application built with Flutter and Material 3.

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Local Database
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28

  # EPUB Parsing
  epubx: ^4.0.0

  # HTML Rendering
  flutter_html: ^3.0.0-beta.2

  # File Picking
  file_picker: ^11.0.2

  # Path & Storage
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.3.5

  # Utilities
  uuid: ^4.5.1
  intl: ^0.19.0
  collection: ^1.19.1
  crypto: ^3.0.6

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.22.1
  build_runner: ^2.4.14

flutter:
  uses-material-design: true

  assets:
    - assets/covers/
    - assets/demo_books/
