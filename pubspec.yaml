name: material_3_demo
description: A modern e-book reader application built with Flutter and Material 3.

publish_to: "none"

version: 0.0.1+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Local Database
  drift: ^2.25.0
  sqlite3_flutter_libs: ^0.6.0+eol

  # EPUB Parsing
  epubx: ^4.0.0
  image: ^3.3.0

  # HTML Rendering
  flutter_html: ^3.0.0-beta.2

  # File Picking
  file_picker: ^11.0.2

  # Path & Storage
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.5.2

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.3
  collection: ^1.19.1
  crypto: ^3.0.6

  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.0
  pdfrx: ^1.3.5
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.25.0
  build_runner: ^2.4.15
  flutter_launcher_icons: ^0.9.3
  change_app_package_name: ^1.5.0

flutter:
  uses-material-design: true

  assets:
    - assets/covers/
    - assets/demo_books/
    - assets/icon/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"

  adaptive_icon_background: "#32116D"
  adaptive_icon_foreground: "assets/icon/FOREGROUND.png"
  adaptive_icon_monochrome: "assets/icon/MONOCHROME.png"

  web:
    generate: true
    image_path: "assets/icon/icon.png"

  windows:
    generate: true
    image_path: "assets/icon/icon.png"

  macos:
    generate: true
    image_path: "assets/icon/icon.png"
    